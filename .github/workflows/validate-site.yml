name: Validate Quarto site

on:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run website generation tests
        run: python -m unittest discover -s tests -v

      - name: Check generated Hub research sources
        run: |
          python scripts/sync_hub_research.py \
            --source-file data/hub-public-research.json \
            --check

      - name: Check generated Zotero publication sources
        run: python scripts/sync_zotero_publications.py --check

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2
