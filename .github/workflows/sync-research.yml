name: Sync GeoEpi research

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1"

permissions:
  contents: write

concurrency:
  group: geoepi-website-research-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Refresh generated research
    runs-on: ubuntu-latest
    steps:
      - name: Check out website main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run website generation tests
        run: python -m unittest discover -s tests -v

      - name: Synchronize Hub research feed
        run: python scripts/sync_hub_research.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Commit changed generated research and site output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hub-public-research.json research/ docs/
          if git diff --cached --quiet; then
            echo "No generated research or site changes."
            exit 0
          fi
          git commit -m "chore(site): sync Hub research"
          git push origin HEAD:main
